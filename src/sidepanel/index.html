<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen Browser Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="modes" role="tablist" aria-label="Mode">
        <button id="mode-ask" class="mode is-active" role="tab" aria-selected="true">Ask</button>
        <button id="mode-agent" class="mode" role="tab" aria-selected="false">Agent</button>
      </div>
      <button id="open-settings" class="icon-button" title="Settings" aria-label="Settings">&#9881;</button>
    </header>

    <p id="status" class="status" role="status"></p>
    <p id="error" class="error-banner" role="alert" data-testid="qwen-error" hidden></p>

    <main id="transcript" class="transcript" aria-live="polite" data-testid="qwen-messages"></main>

    <div id="confirm" class="confirm" hidden>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-allow" class="primary">Allow</button>
        <button id="confirm-deny">Skip</button>
      </div>
    </div>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="2"
        placeholder="Ask about this page…"
        aria-label="Message"
        data-testid="qwen-input"
      ></textarea>
      <div class="composer-actions">
        <span id="context-note" class="context-note"></span>
        <button id="stop" type="button" class="danger" hidden>Stop</button>
        <button id="send" type="submit" class="primary" data-testid="qwen-send">Send</button>
      </div>
    </form>

    <script type="module" src="main.js"></script>
  </body>
</html>
